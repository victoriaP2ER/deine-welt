<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <filter id="pinsel" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018 0.05" numOctaves="3" seed="3" result="wackel"/>
      <feDisplacementMap in="SourceGraphic" in2="wackel" scale="16" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <linearGradient id="strich" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f2f2f2"/>
      <stop offset="1" stop-color="#d8d8d8"/>
    </linearGradient>
  </defs>
  <g filter="url(#pinsel)">
    <circle cx="128" cy="128" r="112" fill="url(#strich)"/>
    <circle cx="104" cy="102" r="52" fill="#ffffff" opacity="0.45"/>
  </g>
</svg>
