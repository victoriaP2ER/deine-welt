<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <filter id="pinsel" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018 0.05" numOctaves="3" seed="83" result="wackel"/>
      <feDisplacementMap in="SourceGraphic" in2="wackel" scale="10" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <linearGradient id="strich" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f2f2f2"/>
      <stop offset="1" stop-color="#d8d8d8"/>
    </linearGradient>
    <radialGradient id="weich">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
<g filter="url(#pinsel)"><circle cx="128" cy="128" r="104" fill="url(#strich)"/></g></svg>
