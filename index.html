<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05060f">
<meta name="description" content="Deine Welt - ein kleiner Planet, der wieder wächst, wenn sich jemand um ihn kümmert.">
<title>Deine Welt</title>
<link rel="icon" href="bilder/icon-mond.svg">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap">
<link rel="stylesheet" href="src/stil.css">

<!-- Damit der Browser weiss, wo three.js liegt -->
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.min.js",
    "three/addons/": "./vendor/addons/"
  }
}
</script>
</head>
<body>

<canvas id="buehne"></canvas>

<!-- Titel am Anfang -->
<div id="titel" class="titel">
  <h1>Deine Welt</h1>
  <p id="titel-hinweis">Tippe auf das Licht</p>
</div>

<!-- Sprechblase vom Mond -->
<div id="blase" class="blase" hidden>
  <p id="blase-text"></p>
  <div class="blase-weiter" id="blase-weiter">weiter ▸</div>
  <div class="blase-zipfel"></div>
</div>

<!-- Hinweis, was man tun kann -->
<div id="hinweis" class="hinweis" hidden></div>

<!-- Was du in der Hand hast -->
<div id="tasche" class="tasche"></div>

<!-- Knöpfe oben rechts -->
<div class="knoepfe">
  <button id="knopf-ton" class="knopf" title="Ton an/aus" aria-label="Ton an oder aus">🔊</button>
  <button id="knopf-neu" class="knopf" title="Von vorne anfangen" aria-label="Von vorne anfangen">↺</button>
</div>

<!-- Gesammelte Sterne = geschaffte Aufgaben -->
<div id="sterne" class="sterne"></div>

<!-- Ladehinweis, falls three.js fehlt -->
<noscript><div class="fehler">Für dieses Spiel muss JavaScript erlaubt sein.</div></noscript>

<script type="module" src="src/main.js"></script>
</body>
</html>
